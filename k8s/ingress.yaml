apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-api
  namespace: demo
spec:
  # Traefik ships with k3s and listens on port 80 of the node
  ingressClassName: traefik
  rules:
    - http:
        paths:
          # the agent
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: demo-api
                port:
                  number: 80
          # the MCP server, for clients outside the cluster
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: docs-mcp
                port:
                  number: 8001
          # everything else is the web page
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
