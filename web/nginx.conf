# The web server of the page: static files only.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Vite puts a hash of the content in these file names: a changed file has a new name,
    # so a browser may keep what it has for as long as it likes
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The sample pictures. The desktop app is not served from here and shows them too,
    # so they may be read from a page on another address; they are public anyway.
    location /samples/ {
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=3600";
    }
}
