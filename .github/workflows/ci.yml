name: ci

on:
  push:
    branches: [main]
  pull_request:

# What the token of every job may do, unless the job asks for more
permissions:
  contents: read

defaults:
  run:
    # explicit bash also means "-o pipefail": a failure on the left of a pipe fails the step
    shell: bash

env:
  KUBECTL_VERSION: v1.34.1

jobs:
  # test + build run on GitHub's own runners
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # the build type-checks first, so it fails on a type error
      - run: npm run build
      - run: npm test

  build:
    needs: [test, test-web]
    # pull requests are only tested: images are built from the main branch
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # ghcr.io wants lowercase names, and a GitHub user name can contain capitals
      - run: echo "IMAGES=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The bench image holds the models and the pictures: it is large and changes rarely.
      # Its tag is the number in bench/VERSION, and it is built only when the registry
      # does not have that number yet. Raise the number when something in bench/ changes.
      - name: Bench image
        run: |
          BENCH="$IMAGES/bench:$(cat bench/VERSION)"
          echo "BENCH=$BENCH" >> "$GITHUB_ENV"
          if ! docker manifest inspect "$BENCH" > /dev/null 2>&1; then
            docker build -f bench/Dockerfile -t "$BENCH" .
            docker push "$BENCH"
          fi
      - run: |
          docker build --build-arg APP_VERSION="${GITHUB_SHA::7}" -t "$IMAGES/agent:$GITHUB_SHA" .
          docker build -f mcp-server/Dockerfile -t "$IMAGES/docs-mcp:$GITHUB_SHA" .
          docker build -f sandbox/Dockerfile -t "$IMAGES/sandbox-mcp:$GITHUB_SHA" .
          # the page takes the sample pictures from the bench image
          docker build -f web/Dockerfile --build-arg BENCH_IMAGE="$BENCH" -t "$IMAGES/web:$GITHUB_SHA" .
          docker push "$IMAGES/agent:$GITHUB_SHA"
          docker push "$IMAGES/docs-mcp:$GITHUB_SHA"
          docker push "$IMAGES/sandbox-mcp:$GITHUB_SHA"
          docker push "$IMAGES/web:$GITHUB_SHA"

  # deploy runs on our own runner inside the k3s cluster ("k3s" is the name of the runner scale set).
  # kubectl authenticates with the service account of the runner pod, so no kubeconfig
  # is stored in GitHub and the Kubernetes API is never exposed to the internet.
  deploy:
    needs: build
    # skipped until the runner is installed and the repository variable OLLAMA_URL is set
    if: vars.OLLAMA_URL != ''
    runs-on: k3s
    # one deploy at a time: a second push waits for the first rollout
    concurrency: deploy
    permissions:
      contents: read
      packages: read
    env:
      # Repository variables (Settings - Secrets and variables - Actions - Variables).
      # OLLAMA_URL has no default: it is the address of Ollama as seen from the pods of that cluster.
      OLLAMA_URL: ${{ vars.OLLAMA_URL }}
      CHAT_MODEL: ${{ vars.CHAT_MODEL || 'granite4.1:3b' }}
      EMBED_MODEL: ${{ vars.EMBED_MODEL || 'nomic-embed-text' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install kubectl
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSLo "$HOME/bin/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x "$HOME/bin/kubectl"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Deploy
        env:
          # Valid only while this job runs: enough for the cluster to pull the images
          # during the rollout, and no long-lived registry password is left in the cluster
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGES="ghcr.io/${GITHUB_REPOSITORY,,}"
          kubectl -n demo create secret docker-registry ghcr \
            --docker-server=ghcr.io \
            --docker-username="$GITHUB_ACTOR" \
            --docker-password="$REGISTRY_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n demo create configmap llm-config \
            --from-literal=OLLAMA_URL="$OLLAMA_URL" \
            --from-literal=CHAT_MODEL="$CHAT_MODEL" \
            --from-literal=EMBED_MODEL="$EMBED_MODEL" \
            --dry-run=client -o yaml | kubectl apply -f -
          sed "s|IMAGE_PLACEHOLDER|$IMAGES/agent:$GITHUB_SHA|" k8s/deployment.yaml | kubectl apply -f -
          sed "s|MCP_IMAGE_PLACEHOLDER|$IMAGES/docs-mcp:$GITHUB_SHA|" k8s/docs-mcp.yaml | kubectl apply -f -
          sed "s|WEB_IMAGE_PLACEHOLDER|$IMAGES/web:$GITHUB_SHA|" k8s/web.yaml | kubectl apply -f -
          sed -e "s|SANDBOX_IMAGE_PLACEHOLDER|$IMAGES/sandbox-mcp:$GITHUB_SHA|" \
              -e "s|BENCH_IMAGE_PLACEHOLDER|$IMAGES/bench:$(cat bench/VERSION)|" k8s/sandbox-mcp.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml -f k8s/ingress.yaml
          kubectl -n demo rollout status deployment/docs-mcp --timeout=180s
          # longer than the others: with a new bench image the node first has to download it
          kubectl -n demo rollout status deployment/sandbox-mcp --timeout=900s
          kubectl -n demo rollout status deployment/demo-api --timeout=180s
          kubectl -n demo rollout status deployment/web --timeout=180s
