# Local single-node k3s inside Docker: same Kubernetes we later run on EC2, at zero cost.
# Reachable only from this PC: API on 127.0.0.1:6443, Traefik ingress on 127.0.0.1:8080.
name: devops-lab

services:
  k3s:
    image: rancher/k3s:v1.34.1-k3s1
    container_name: devops-lab-k3s
    command: server
    privileged: true
    tmpfs:
      - /run
      - /var/run
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
      K3S_KUBECONFIG_MODE: "666"
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      # admin kubeconfig for kubectl on the host (git-ignored)
      - ./kubeconfig:/output
    ports:
      - "127.0.0.1:6443:6443"
      - "127.0.0.1:8080:80"

volumes:
  k3s-data: {}
